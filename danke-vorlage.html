<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{neue_texte.danke_titel}} | {{einstellungen.name}}</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#9db4ab">
<!-- Gebaut aus danke-vorlage.html und fragen.json mit bauen.py. Nicht in danke.html aendern. -->
<style>
@font-face {
  font-family: 'Montserrat';
  font-style: normal;
  font-weight: 300 700;
  font-display: swap;
  src: url('assets/fonts/montserrat-latin.woff2') format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
@font-face {
  font-family: 'Montserrat';
  font-style: normal;
  font-weight: 300 700;
  font-display: swap;
  src: url('assets/fonts/montserrat-latin-ext.woff2') format('woff2');
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
}
:root{
  --sage:#9db4ab;
  --sage-dark:#7a9a8d;
  --cream:#F7F3EA;
  --warm:#3d3632;
  --text-mid:#6b6058;
  --text-light:#7d756e;
  --w:#fff;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--cream);color:var(--warm);font-family:'Montserrat',-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
.kopfzeile{display:flex;justify-content:center;padding:18px 0 4px}
.kopfname{font-size:.95rem;letter-spacing:.14em;text-transform:uppercase;color:#a19d9d}
main{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:24px 16px 40px}
.karte{max-width:560px;width:100%;background:var(--w);border-radius:6px;padding:2.2rem 1.6rem;text-align:center}
.zeichen{width:64px;height:64px;border-radius:50%;background:var(--sage);display:flex;align-items:center;justify-content:center;margin:0 auto 1.4rem}
.zeichen svg{width:30px;height:30px;stroke:var(--warm);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:clamp(22px,5vw,28px);font-weight:500;line-height:1.35;margin:0 0 1rem}
p{font-size:15.5px;font-weight:300;color:var(--text-mid);margin:0 0 1rem}
.btn{display:inline-block;margin-top:.6rem;background:var(--sage);color:var(--warm);border-radius:5px;padding:.95rem 2.1rem;font-size:15px;font-weight:600;text-decoration:none}
.btn:hover{background:var(--sage-dark)}
footer{text-align:center;font-size:12.5px;color:var(--text-light);padding:24px 16px 32px}
footer a{color:var(--text-light)}
</style>
</head>
<body>

<header class="kopfzeile">
  <span class="kopfname">{{einstellungen.name}}</span>
</header>

<main>
  <div class="karte">
    <div class="zeichen" aria-hidden="true">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"></rect><polyline points="3 7 12 13 21 7"></polyline></svg>
    </div>
    <h1>{{neue_texte.danke_titel}}</h1>
    <p>{{neue_texte.danke_text}}</p>
    <p>{{neue_texte.danke_spam}}</p>
    <a class="btn" href="./">{{neue_texte.danke_zurueck}}</a>
  </div>
</main>

<footer>
  &copy; 2026 {{einstellungen.name}} &middot;
  <a href="{{einstellungen.impressum_url}}" target="_blank" rel="noopener">{{neue_texte.fuss_impressum}}</a> &middot;
  <a href="{{einstellungen.datenschutz_url}}" target="_blank" rel="noopener">{{neue_texte.fuss_datenschutz}}</a>
</footer>

</body>
</html>
